

services:
  myservice:
    image: qbuild
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NB_UID=${NB_UID}
        - NB_GID=${NB_GID}
        - DEBIAN_VERSION=${DEBIAN_VERSION}
        # Exported by shscripts/release_vars.sh (run via docker_build_and_push.sh); the build stops if unset.
        - QUARTO_VER=${QUARTO_VERSION:?QUARTO_VERSION is required}
    entrypoint: sh -c "sleep infinity"